<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&display=swap">
<style>
:root{--red:#e02a2a;--bg:#e4e2dd;--card:#fbfaf7;--in:#eeece7;--fg:#141010;--mut:#5f5858;--bd:#c9c5be;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151010;--card:#231b1b;--in:#2f2525;--fg:#f1eee9;--mut:#a99e9e;--bd:#473838;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151010;--card:#231b1b;--in:#2f2525;--fg:#f1eee9;--mut:#a99e9e;--bd:#473838;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:10}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:relative;overflow:hidden;background:var(--red);padding:20px 14px 58px}
header svg{position:absolute;right:-80px;top:-70px;width:290px;height:290px}
.stk{position:relative;display:inline-block;margin:0 0 8px;padding:7px 14px;background:#fff;color:#141010;border-radius:12px;font:400 26px/1.1 Neucha,"Comic Sans MS",system-ui,sans-serif;transform:rotate(-1.5deg)}
.s2{display:table;font-size:17px;padding:5px 11px;transform:rotate(1deg)}
.s2:empty{display:none}
main{position:relative;max-width:560px;margin:-36px auto 0;padding:0 12px 40px}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;padding:10px 2px;font:400 17px Neucha,"Comic Sans MS",system-ui,sans-serif;background:#fff;color:#141010;border:0;border-radius:12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ex{background:var(--card);border-radius:18px;padding:12px;margin:0 0 12px}
.ex h2{margin:0;font:400 22px/1.15 Neucha,"Comic Sans MS",system-ui,sans-serif}
.meta{color:var(--mut);font-size:14px;margin:3px 0 0}
.gal{display:flex;gap:8px;overflow-x:auto;margin:8px 0}
.gal .p{position:relative;flex:0 0 auto}
.gal img{display:block;height:150px;max-width:230px;object-fit:cover;border-radius:12px}
.x{position:absolute;top:4px;right:4px;width:26px;height:26px;border:0;border-radius:13px;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.nop,.add{flex:0 0 auto;height:150px;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;color:var(--mut);padding:8px}
.nop{width:170px;border:2px dashed var(--bd)}
.add{width:84px;background:var(--in);cursor:pointer}
.pf{display:none}
.row{display:flex;gap:8px;align-items:flex-end;margin:6px 0}
.f{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.f label{font-size:13px;color:var(--mut)}
input[type=number],input[type=date]{width:100%;height:52px;padding:9px 8px;font:500 18px system-ui,sans-serif;color:var(--fg);background:var(--in);border:2px solid transparent;border-radius:10px}
input.t{font:400 26px Neucha,system-ui,sans-serif;color:var(--red);border-color:var(--red)}
input.bad{border-color:var(--fg);background:var(--bd)}
.save{width:100%;margin-top:6px;padding:11px;font:400 21px Neucha,"Comic Sans MS",system-ui,sans-serif;background:var(--red);color:#fff;border:0;border-radius:12px;cursor:pointer}
.msg{min-height:20px;font-size:14px;margin-top:4px}
.msg.e{color:var(--red);font-weight:600}.msg.o{color:var(--mut)}
.hist{display:block;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px}
.del{margin-left:6px;padding:2px 8px;font:400 13px system-ui,sans-serif;background:transparent;color:var(--mut);border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--bd);font-size:14px;color:var(--mut)}
.foot input{width:auto;font-size:16px}
#reset{margin-top:10px;padding:8px 12px;background:transparent;color:var(--fg);border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;font:500 15px system-ui,sans-serif}
</style>
</head>
<body>
<header>
<svg viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#e4e2dd"><circle cx="100" cy="100" r="64" stroke-width="22"/><path d="M100 36V0M100 164v36M36 100H0M164 100h36" stroke-width="12" transform="rotate(15 100 100)"/></g><circle cx="100" cy="100" r="30" fill="#e4e2dd"/></svg>
<h1 class="stk">Дневник тренировок</h1>
<div class="stk s2" id="blk"></div>
</header>
<main>
<noscript><div class="ex"><h2>Страница открыта без скриптов</h2><p class="meta">Просмотр файлов на iPhone отключает скрипты, поэтому тренировки не показаны. Открой файл в Safari или Chrome, либо используй ссылку на приложение в чате Claude.</p></div></noscript>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div class="foot">
<label>Начало цикла: <input type="date" id="start"></label>
<p id="st"></p>
<button id="reset">Сбросить все записи</button>
</div>
</main>

var ti=sec.querySelector('.t'),wi=sec.querySelector('.w'),msg=sec.querySelector('.msg');
var reps=[].map.call(sec.querySelectorAll('.r'),function(i){return+i.value||0});
ti.classList.remove('bad');if(wi)wi.classList.remove('bad');
function err(t){msg.className='msg e';msg.textContent=t}
if(ti.value===''){ti.classList.add('bad');return err('Укажи целевой вес, запись без цели не сохраняется.')}
if(wi&&wi.value===''){wi.classList.add('bad');return err('Укажи рабочий вес.')}
if(!reps.some(function(x){return x>0}))return err('Введи повторы хотя бы в одном подходе.');
var c=cur(),tw=+ti.value,w=e.u==='с'?Math.max.apply(null,reps):+wi.value;
S.targets[e.id]={b:c.b,w:tw};
S.logs=S.logs.filter(function(l){return!(l.ex===e.id&&l.d===today())});
S.logs.push({d:today(),day:day,ex:e.id,b:c.b,t:tw,w:w,reps:reps});
save();msg.className='msg o';msg.textContent='Записано';
sec.querySelector('.last').textContent=lastLine(e);
}
function recC(){
var s=$('#cardio'),msg=s.querySelector('.msg');
var i=+s.querySelector('.ci').value,v=+s.querySelector('.cs').value,m=+s.querySelector('.cm').value,wm=s.querySelector('.cw').checked;
if(!(m>0)||!(v>0)){msg.className='msg e';msg.textContent='Укажи скорость и минуты.';return}
S.logs=S.logs.filter(function(l){return!(l.ex==='cardio'&&l.d===today())});
S.logs.push({d:today(),day:'C',ex:'cardio',b:cur().b,t:i,w:v,min:m,warm:wm});
save();msg.className='msg o';msg.textContent='Записано';
}
function regal(id){var s=document.querySelector('[data-id="'+id+'"]'),g=s&&s.querySelector('.gal');if(g)g.outerHTML=gal(id)}
function shrink(file,cb){
var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){
var s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');
c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};
r.readAsDataURL(file);
}
document.addEventListener('change',function(ev){
var t=ev.target;
if(t.classList&&t.classList.contains('pf')&&t.files&&t.files[0]){
var id=t.getAttribute('data-id');
shrink(t.files[0],function(d){(PH[id]=PH[id]||[]).push(d);savePh();regal(id)});
}
if(t.id==='start'&&t.value){S.start=t.value;save();render()}
});
document.addEventListener('click',function(ev){
var t=ev.target,b=t.closest?t.closest('button'):null;
if(armed&&!(b&&b.id==='reset')){armed=false;$('#reset').textContent=RS}
if(!b)return;
if(b.getAttribute('data-k')){tab=b.getAttribute('data-k');render();return}
if(b.id==='csave'){recC();return}
if(b.classList.contains('save')){rec(b.closest('.ex'));return}
if(b.classList.contains('del')){S.logs.splice(+b.getAttribute('data-i'),1);save();render();return}
if(b.classList.contains('x')){var id=b.getAttribute('data-id');PH[id].splice(+b.getAttribute('data-i'),1);savePh();regal(id);return}
if(b.id==='reset'){
if(!armed){armed=true;b.textContent='Нажми еще раз, чтобы стереть все';return}
S={start:today(),targets:{},logs:[]};save();armed=false;b.textContent=RS;render();
}
});
render();status();
})();
</script>
</body>
</html>
